<html lang="en">
<head>
  <title>Book a Wash — 2Fast2Clean</title>
  <link rel="stylesheet" href="style.css">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
</head>
<body data-page="booking">
  <div class="main">
    <div class="navbar">
      <div class="icon">
        <h2 class="logo">2Fast2Clean</h2>
      </div>

      <div class="menu">
        <ul>
          <li><a href="index.html">HOME</a></li>
          <li><a href="services.html">SERVICES</a></li>
          <li><a href="booking.html">BOOK</a></li>
          <li><a href="admin.html">ADMIN</a></li>
          <li><a href="about.html">ABOUT</a></li>
          <li><a href="#" id="logoutLink" style="display:none;">LOGOUT</a></li>
        </ul>
      </div>
    </div> 

    <div class="content slim">
      <!-- rest of your booking content stays the same -->

      <h1>Book your wash in <span>Pretoria</span></h1>
      <p class="par">
        Fill in your details below. On the next step you’ll choose how you want to pay:
        in person, card, PayFast, or Yoco.
      </p>

     <!-- Booking form box -->
<!-- BOOKING FORM (booking.html) -->
<div class="booking-form">
  <h3>Book your wash</h3>

  <label for="service">Service</label>
  <select id="service">
    <option value="">Select a package</option>
    <option value="express">Express Wash – R80</option>
    <option value="standard">Standard Wash – R120</option>
    <option value="premium">Premium Detail – R250</option>
  </select>

  <label for="date">Date</label>
  <input type="date" id="date">

  <label for="time">Time</label>
  <input type="time" id="time">

  <label for="name">Full name</label>
  <input type="text" id="name" placeholder="e.g. Thabo Mokoena">

  <label for="email">Email (optional)</label>
  <input type="email" id="email" placeholder="you@example.com">

  <label for="phone">Phone (+27…)</label>
  <input type="tel" id="phone" placeholder="+27…">

  <!-- 🔹 NEW: SAVE BOOKING BUTTON -->
  <button class="btnn wide" id="saveBookingBtn">Save booking</button>

  <!-- 🔹 CONFIRM & PAY BUTTON -->
  <button class="btnn wide" id="confirmPayBtn">Confirm &amp; Pay</button>

  <!-- message area -->
  <p id="bookingMessage" class="booking-message"></p>
</div>


    </div>
  </div>
  <script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
