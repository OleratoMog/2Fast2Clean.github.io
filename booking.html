<!DOCTYPE html>
<html lang="en">
<head>
  <title>Book a Wash — 2Fast2Clean</title>
  <link rel="stylesheet" href="style.css">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
</head>
<body data-page="booking">
  <div class="main">
    <div class="navbar">
      <div class="icon">
        <h2 class="logo">2Fast2Clean</h2>
      </div>

      <div class="menu">
        <ul>
          <li><a href="index.html">HOME</a></li>
          <li><a href="services.html">SERVICES</a></li>
          <li><a href="booking.html" class="active">BOOK</a></li>
          <li><a href="admin.html">ADMIN</a></li>
          <li><a href="about.html">ABOUT</a></li>
        </ul>
      </div>
    </div>

    <div class="content slim">
      <h1>Book your wash in <span>Pretoria</span></h1>
      <p class="par">
        Fill in your details below. On the next step you’ll choose how you want to pay:
        in person, card, PayFast, or Yoco.
      </p>

     <!-- Booking form box -->
<div class="booking-form">
  <h3>Confirm your booking</h3>

  <label for="name">Full Name</label>
  <input id="name" type="text" placeholder="e.g. Thabo Mokoena">

  <label for="phone">Phone (+27…)</label>
  <input id="phone" type="tel" placeholder="+27…">

  <label for="email">Email (optional)</label>
  <input id="email" type="email" placeholder="you@example.com">

  <label for="day">Date</label>
  <input id="day" type="date">

  <label for="time">Time</label>
  <input id="time" type="time">

  <label for="service">Service</label>
  <select id="service">
    <option value="">Select a package</option>
    <option value="express">Express Wash — R80</option>
    <option value="standard">Standard Wash — R120</option>
    <option value="premium">Premium Detail — R250</option>
  </select>

  <!-- THIS is the important button -->
  <button
    id="confirmPayBtn"
    class="btnn wide"
    type="button"
  >
    Confirm &amp; Pay
  </button>

  <p id="bookingMessage" class="booking-message"></p>
</div>

    </div>
  </div>
  <script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
